server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:

        - id: categoria-service
          uri: lb://categoria-service
          predicates:
            - Path=/api/categorias/**

        - id: producto-service
          uri: lb://producto-service
          predicates:
            - Path=/api/productos/**

        # Actividad: publicar cliente-service y pedido-service mediante el Gateway
        - id: cliente-service
          uri: lb://cliente-service
          predicates:
            - Path=/api/clientes/**

        - id: pedido-service
          uri: lb://pedido-service
          predicates:
            - Path=/api/pedidos/**

# Expone /actuator/gateway/routes para ver las rutas registradas
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: read-only

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
