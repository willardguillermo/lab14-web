spring:
  application:
    name: producto-service
  profiles:
    active: dev
  config:
    # La configuracion (puerto, BD, JPA, mensaje) se obtiene del config-server
    import: optional:configserver:http://localhost:8888

# Configuracion Eureka
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

# Circuit Breaker para las llamadas a categoria-service
resilience4j:
  circuitbreaker:
    instances:
      categoriaService:
        registerHealthIndicator: true
        slidingWindowSize: 5          # evalua las ultimas 5 llamadas
        minimumNumberOfCalls: 3       # minimo de llamadas antes de calcular el % de fallos
        failureRateThreshold: 50      # si falla el 50% o mas, el circuito se ABRE
        waitDurationInOpenState: 10s  # tiempo abierto antes de pasar a HALF_OPEN

  # Retry: reintenta la llamada si falla por una causa temporal
  retry:
    instances:
      categoriaRetry:
        maxAttempts: 3      # 1 intento + 2 reintentos
        waitDuration: 2s    # espera entre intentos
        ignoreExceptions:
          # Con el circuito ABIERTO no tiene sentido reintentar: fallback inmediato
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          # Un 404 no es un fallo temporal
          - feign.FeignException$NotFound

# Actuator: estado de los circuitos
management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers,circuitbreakerevents,retries,bulkheads
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
